<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AETHER Core v1.0.0 — Foundation</title>
<style>
:root{--bg:#07070f;--fg:#e8e8f4;--muted:#7a7a9a;--accent:#7c5cfc;--ok:#22d3a6;--err:#f43f6e;--panel:#0e0e1a;--border:#1e1e32;--font:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}

.badge{font-size:9px;padding:2px 8px;border:1px solid var(--border);border-radius:4px;color:var(--muted)}
.badge.hot{border-color:var(--accent);color:#c4b5fd}
main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
#right{width:420px;display:flex;flex-direction:column;background:var(--panel);min-width:280px}
.toolbar{padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,.toolbar select{background:#1a1a2e;color:var(--fg);border:1px solid var(--border);padding:5px 12px;border-radius:6px;font:12px var(--font);cursor:pointer}
button.primary{background:linear-gradient(135deg,#7c5cfc,#5b3fd4);border:none;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
#editor{flex:1;background:#05050c;color:var(--fg);border:none;outline:none;padding:14px;font:13px/1.55 var(--font);resize:none;tab-size:2;white-space:pre}
#out{flex:1;overflow:auto;padding:12px;font:12px/1.5 var(--font);white-space:pre-wrap}
#out .ok{color:var(--ok)}#out .err{color:var(--err)}#out .info{color:#22d3ee}#out .sys{color:var(--muted)}
#chat{display:none;flex:1;flex-direction:column;min-height:0}#chat.open{display:flex}
#chatlog{flex:1;overflow:auto;padding:12px}
.msg{margin:8px 0;padding:8px 12px;border-radius:10px;max-width:90%;font-size:13px;line-height:1.5;white-space:pre-wrap}
.msg.user{background:linear-gradient(135deg,#2a1f5e,#1a1440);margin-left:auto}
.msg.bot{background:#12121f;border:1px solid var(--border)}
#composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
#composer input{flex:1;background:#080810;border:1px solid var(--border);color:var(--fg);padding:10px;border-radius:8px;font:13px var(--font);outline:none}
#status{padding:5px 12px;background:var(--panel);border-top:1px solid var(--border);font-size:10px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:800px){#right{width:100%;max-height:40vh}main{flex-direction:column}}
</style>
</head>

<header>

  <span class="badge hot">Foundation · v1.0.0</span>

  <span class="badge" id="hostBadge">…</span>

    </div>

        this.nodes.set(next,{type:'dir',children:new Set(),ts:HOST.now()});

  write(path,content,meta){
    path=this.normalize(path);

    if(parent)this.ensureDir(parent);
    const prev=this.nodes.get(path);
    if(prev&&prev.type==='dir')throw new Error('EISDIR: '+path);
    this.nodes.set(path,{type:'file',content:String(content),meta:meta||{},ts:HOST.now()});
    if(parent)this.nodes.get(parent).children.add(path);
    return path;
  },
  read(path){
    path=this.normalize(path);
    const n=this.nodes.get(path);
    if(!n)throw new Error('ENOENT: '+path);
    if(n.type==='dir')throw new Error('EISDIR: '+path);
    return n.content;
  },
  mkdir(path){this.ensureDir(path);return this.normalize(path);},
  exists(path){return this.nodes.has(this.normalize(path));},
  isDir(path){const n=this.nodes.get(this.normalize(path));return n&&n.type==='dir';},
  isFile(path){const n=this.nodes.get(this.normalize(path));return n&&n.type==='file';},
  list(path){
    path=this.normalize(path||'/');
    const n=this.nodes.get(path);
    if(!n)throw new Error('ENOENT: '+path);
    if(n.type!=='dir')throw new Error('ENOTDIR: '+path);
    return [...n.children].sort();
  },
  tree(path,depth){
    path=this.normalize(path||'/');depth=depth==null?8:depth;
    const walk=(p,d)=>{
      const n=this.nodes.get(p);if(!n)return null;
      if(n.type==='file')return{path:p,type:'file',bytes:(n.content||'').length,meta:n.meta};
      const kids=d>0?[...n.children].sort().map(c=>walk(c,d-1)).filter(Boolean):[];
      return{path:p,type:'dir',children:kids};
    };
    return walk(path,depth);
  },
  remove(path){
    path=this.normalize(path);
    const n=this.nodes.get(path);if(!n)return false;
    if(n.type==='dir'&&n.children.size)throw new Error('ENOTEMPTY: '+path);
    this.nodes.delete(path);
    const parent=this.parent(path);
    if(parent&&this.nodes.has(parent))this.nodes.get(parent).children.delete(path);
    return true;
  },
  scan(path){
    path=this.normalize(path||'/');
    const out=[];const walk=(p)=>{const n=this.nodes.get(p);if(!n)return;if(n.type==='file')out.push({path:p,bytes:(n.content||'').length,meta:n.meta});else for(const c of n.children)walk(c);};walk(path);return out;
  },
  toPixel(path){const content=this.read(path);return PX.ingest('file',path,content);},
  download(path,content,meta){return this.write(path,content,{...(meta||{}),downloaded:true,ts:HOST.now()});},
  stats(){let files=0,dirs=0,bytes=0;for(const n of this.nodes.values()){if(n.type==='file'){files++;bytes+=(n.content||'').length;}else dirs++;}return{files,dirs,bytes,nodes:this.nodes.size};}
};

// ═══════════════════════════════════════════════════════════════════════════
// AUTO‑MOUNT ALL MODELS FROM models.txt – DYNAMIC MULTI‑MODEL (BROWSER ONLY)
// ═══════════════════════════════════════════════════════════════════════════
if (HOST.isBrowser) {
  (function autoMountAllModels() {
    const GITHUB_USER = 'dmythlenz';
    const GITHUB_REPO = '-ther';
    const MODELS_TXT_URL =
      `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/models.txt`;
    const RELEASE_BASE =
      `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases/download/v1.0/`;

    if (typeof AETHER_CORE === 'undefined' || !AETHER_CORE.PX || !AETHER_CORE.FS) {
      console.warn('AETHER_CORE not ready, retrying in 2s...');
      setTimeout(autoMountAllModels, 2000);
      return;
    }

    const PX = AETHER_CORE.PX;
    const FS = AETHER_CORE.FS;

    function uint8ToBase64(u8) {
      const CHUNK_SIZE = 0x8000;
      let parts = [];
      for (let i = 0; i < u8.length; i += CHUNK_SIZE) {
        const slice = u8.subarray(i, Math.min(i + CHUNK_SIZE, u8.length));
        parts.push(String.fromCharCode.apply(null, slice));
      }
      return btoa(parts.join(''));
    }

    async function mountModelFromGitHub(modelId, repo) {
      try {
        const PIX_URL = RELEASE_BASE + `shard_${modelId}.pix`;
        const IDX_URL = RELEASE_BASE + `shard_${modelId}.idx`;

        const idxRes = await fetch(IDX_URL);
        if (!idxRes.ok) {
          console.log(`⏳ ${modelId}: shard not yet uploaded.`);
          return false;
        }

        const pixRes = await fetch(PIX_URL);
        if (!pixRes.ok) throw new Error('Pixel shard missing');

        const [pixBytes, idxBytes] = await Promise.all([
          pixRes.arrayBuffer().then(b => new Uint8Array(b)),
          idxRes.arrayBuffer().then(b => new Uint8Array(b))
        ]);

        const pixB64 = uint8ToBase64(pixBytes);
        const idxB64 = uint8ToBase64(idxBytes);

        FS.mkdir('/shards');
        FS.write(`/shards/${modelId}.pix`, pixB64, { encoding: 'base64' });
        FS.write(`/shards/${modelId}.idx`, idxB64, { encoding: 'base64' });

        PX.ingest('shard', modelId + '.pix', { size: pixBytes.length });
        PX.ingest('shard', modelId + '.idx', { size: idxBytes.length });

        console.log(`✅ ${modelId} mounted from GitHub CDN`);
        return true;
      } catch (e) {
        console.warn(`❌ ${modelId} mount failed:`, e.message);
        return false;
      }
    }

    function addModelToUI(modelId) {
      if (window.MODELS && MODELS.includes(modelId)) return;
      if (window.MODELS) {
        MODELS.push(modelId);
        if (typeof renderModelMenu === 'function') renderModelMenu();
      }
      const status = document.getElementById('kimi-status');
      if (status) {
        const existing = status.textContent;
        const mountedModels = existing.includes('✅') ? existing.split(' · ') : [];
        const modelEntry = `${modelId} ✅`;
        if (!mountedModels.includes(modelEntry)) {
          mountedModels.push(modelEntry);
          status.textContent = mountedModels.join(' · ');
          status.style.color = '#22d3a6';
        }
      }
    }

    async function loadAllModels() {
      try {
        const res = await fetch(MODELS_TXT_URL);
        if (!res.ok) throw new Error('Failed to fetch models.txt');
        const text = await res.text();
        const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));

        let mounted = 0;
        for (const line of lines) {
          const parts = line.trim().split(/\s+/);
          if (parts.length < 2) continue;
          const [modelId, repo] = parts;
          const success = await mountModelFromGitHub(modelId, repo);
          if (success) {
            addModelToUI(modelId);
            mounted++;
          }
        }

        if (mounted > 0) {
          console.log(`✅ ${mounted} model(s) mounted from GitHub CDN.`);
          const btn = document.getElementById('load-kimi-btn');
          if (btn) {
            btn.textContent = `🌌 ${mounted} models ready`;
            btn.disabled = true;
          }
        } else {
          console.log('⏳ No shards found yet. Run the GitHub Action to build them.');
        }
      } catch (e) {
        console.warn('❌ Error loading models.txt:', e.message);
        await mountModelFromGitHub('kimi-k3', 'moonshotai/Kimi-K3')
          .then(ok => { if (ok) addModelToUI('kimi-k3'); });
      }
    }

    function addKimiButton() {
      const toolbar = document.querySelector('.toolbar');
      if (!toolbar || document.getElementById('load-kimi-btn')) return;

      const btn = document.createElement('button');
      btn.id = 'load-kimi-btn';
      btn.textContent = '🌌 Load All Models';
      btn.style.cssText = 'background:linear-gradient(135deg,#7c5cfc,#22d3ee);border:none;color:#fff;font-weight:700';
      btn.onclick = loadAllModels;
      toolbar.appendChild(btn);

      const status = document.createElement('span');
      status.id = 'kimi-status';
      status.style.cssText = 'font-size:10px;color:var(--muted);margin-left:4px';
      status.textContent = '⏳ checking...';
      toolbar.appendChild(status);
    }

    setTimeout(async () => {
      addKimiButton();
      if (FS.exists('/shards/kimi-k3.pix') ||
          FS.exists('/shards/dsv4-pro.pix') ||
          FS.exists('/shards/glm-52.pix')) {
        const status = document.getElementById('kimi-status');
        if (status) {
          status.textContent = '✅ models already mounted';
          status.style.color = '#22d3a6';
        }
        const btn = document.getElementById('load-kimi-btn');
        if (btn) {
          btn.textContent = '🌌 Models Ready';
          btn.disabled = true;
        }
        return;
      }
      await loadAllModels();
    }, 3000);

    window.loadAllModels = loadAllModels;
    window.mountModel = mountModelFromGitHub;
  })();
}
