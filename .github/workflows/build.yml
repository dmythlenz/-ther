name: Pixel Builder (AETHER) – Auto & Manual

on:
  push:
    paths:
      - 'models.txt'
      - 'convert.ae'
      - 'aether-host.js'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model ID (e.g. kimi-k3)'
        required: false
        default: ''
      repo:
        description: 'HF repo (e.g. moonshotai/Kimi-K3)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create shards directory
        run: mkdir -p shards

      - name: Convert models
        id: convert
        run: |
          convert_model() {
            local model=$1
            local repo=$2
            echo "🔄 Converting $model from $repo"
            node aether-host.js convert.ae "$model" "$repo"
            local exitcode=$?
            if [ $exitcode -eq 0 ]; then
              echo "✅ Success: $model"
              # Move files if they are in root (just in case)
              if [ -f "shard_${model}.pix" ]; then
                mv "shard_${model}.pix" "shards/"
              fi
              if [ -f "shard_${model}.idx" ]; then
                mv "shard_${model}.idx" "shards/"
              fi
            else
              echo "❌ Failed: $model (exit $exitcode)"
              return $exitcode
            fi
          }

          # Manual trigger: if model input is provided, convert that one only
          if [ -n "${{ github.event.inputs.model }}" ]; then
            MODEL="${{ github.event.inputs.model }}"
            REPO="${{ github.event.inputs.repo }}"
            [ -z "$REPO" ] && REPO="$MODEL"
            convert_model "$MODEL" "$REPO"
            exit $?
          fi

          # Otherwise read models.txt
          if [ -f models.txt ]; then
            echo "📋 Reading models from models.txt"
            while IFS=' ' read -r model repo || [ -n "$model" ]; do
              [[ -z "$model" || "$model" == \#* ]] && continue
              [ -z "$repo" ] && repo="$model"
              convert_model "$model" "$repo" || true
            done < models.txt
          else
            echo "⚠️  No models.txt found – nothing to do."
            exit 0
          fi

          echo "📦 Generated shards:"
          ls -la shards/ || echo "No shards found"

      - name: Upload shards to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: |
            shards/*.pix
            shards/*.idx
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for debugging (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shards
          path: shards/
