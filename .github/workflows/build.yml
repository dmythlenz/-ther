name: Pixel Builder (AETHER) – Auto & Manual

on:
  push:
    paths:
      - 'models.txt'
      - 'convert.ae'
      - 'aether-host.js'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model ID (e.g. kimi-k3)'
        required: false
        default: ''
      repo:
        description: 'HF repo (e.g. moonshotai/Kimi-K3)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one failure does not stop others
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert models
        id: convert
        run: |
          # Ensure we have aether-core.js (create from embedded if missing)
          if [ ! -f aether-core.js ]; then
            echo "⚠️  aether-core.js not found – please ensure it exists."
            exit 1
          fi

          # Function to convert a single model
          convert_model() {
            local model=$1
            local repo=$2
            echo "🔄 Converting $model from $repo"
            node aether-host.js convert.ae "$model" "$repo"
            local exitcode=$?
            if [ $exitcode -eq 0 ]; then
              echo "✅ Success: $model"
            else
              echo "❌ Failed: $model (exit $exitcode)"
              return $exitcode
            fi
          }

          # Manual trigger with specific model
          if [ -n "${{ github.event.inputs.model }}" ]; then
            MODEL="${{ github.event.inputs.model }}"
            REPO="${{ github.event.inputs.repo }}"
            if [ -z "$REPO" ]; then
              REPO="$MODEL"
            fi
            convert_model "$MODEL" "$REPO"
            exit $?
          fi

          # Read models.txt (one model per line: MODEL [REPO])
          if [ -f models.txt ]; then
            echo "📋 Reading models from models.txt"
            while IFS=' ' read -r model repo || [ -n "$model" ]; do
              # Skip empty lines and comments
              [[ -z "$model" || "$model" == \#* ]] && continue
              if [ -z "$repo" ]; then
                repo="$model"
              fi
              convert_model "$model" "$repo" || true   # continue on failure
            done < models.txt
          else
            echo "⚠️  No models.txt found and no manual input – nothing to do."
            exit 0
          fi

      - name: Upload shards to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: |
            shards/*.pix
            shards/*.idx
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for debugging (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shards
          path: shards/
